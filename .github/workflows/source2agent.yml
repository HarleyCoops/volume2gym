name: Source2Agent quality gates

on:
  push:
    branches:
      - main
      - "rebrand/**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.33"
          enable-cache: true
      - name: Install package
        run: >-
          uv sync --locked --project environments/railroad_1959_v1
          --group dev --python 3.12
      - name: Run offline source-to-agent gate
        run: >-
          PYTHON_BIN=environments/railroad_1959_v1/.venv/bin/python
          bash scripts/prime-agent-gate.sh
