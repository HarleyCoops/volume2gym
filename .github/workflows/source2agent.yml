name: Source2Agent quality gates

on:
  push:
    branches:
      - main
      - "rebrand/**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run offline source-to-agent gate
        run: bash scripts/prime-agent-gate.sh
